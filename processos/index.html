<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de Processos Administrativos — Coordenação Administrativa</title>
<meta name="description" content="Central de consulta dos processos administrativos da Diretoria Socioeducacional (DSE).">

<!--
  ============================================================================
  PORTAL DE PROCESSOS DSE — COORDENAÇÃO ADMINISTRATIVA
  Arquivo único (HTML + CSS + JavaScript). Sem frameworks e sem dependências externas.

  ORGANIZAÇÃO DO ARQUIVO
    1. <style>  ........ identidade visual (variáveis CSS no topo) e layout
    2. <body>   ........ apenas o "esqueleto" (cabeçalho, menu, área de conteúdo)
    3. <script> ........ dividido em:
         A) CONFIG  .... versão do portal e data do Guia de origem
         B) DADOS   .... TODO o conteúdo (processos, FAQ, contatos, manutenção)  <-- edite aqui
         C) MOTOR   .... código que monta as telas, a busca e a navegação (não precisa mexer)

  Para atualizar conteúdos, veja a seção "Como manter e atualizar este portal" dentro do próprio portal.
  Fonte do conteúdo: Guia de Processos da Coordenação Administrativa DSE 2026 — versão revisada de 29/09/2026.
  ============================================================================
-->

<style>
/* ==========================================================================
   1. IDENTIDADE VISUAL — altere as cores/medidas aqui
   ========================================================================== */
:root{
  --brand:#0f4c81;       /* cor principal (azul institucional) */
  --brand-dark:#0a3558;
  --brand-light:#e7f0f9;
  --bg:#f4f6fa;
  --surface:#ffffff;
  --ink:#1b2430;         /* texto principal */
  --muted:#4f5b6d;       /* texto secundário (contraste AA sobre branco) */
  --line:#d9e0ea;
  --ok:#17744a;
  --warn-bg:#fff3dc;
  --warn-line:#e2a100;
  --warn-ink:#6b4400;
  --danger-bg:#fdeaea;
  --danger-line:#c0392b;
  --danger-ink:#7a1f16;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.06);
  --shadow-lg:0 10px 30px rgba(16,32,56,.14);
  --topbar-h:68px;
  --sidebar-w:288px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 16px)}
body{margin:0;font:16px/1.6 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:0 0 .8em}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
ul{margin:0 0 .8em;padding-left:1.2em}
li{margin:.2em 0}

/* Foco visível para navegação por teclado */
:focus-visible{outline:3px solid #ffb703;outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:10px 14px;border-radius:8px;z-index:200;box-shadow:var(--shadow-lg)}
.skip:focus{left:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --------------------------- Cabeçalho --------------------------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:60}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:44px;height:44px;font-size:1.3rem;line-height:1}
.brand{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:none;padding:0;text-align:left}
.brand-mark{flex:none;width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#2b7bbf);color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.02em}
.brand h1{font-size:1.08rem;color:var(--brand-dark);white-space:nowrap}
.brand p{margin:0;font-size:.8rem;color:var(--muted);white-space:nowrap}
.search{position:relative;flex:1;max-width:580px;margin-left:auto}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:999px;padding:0 44px 0 44px;font:inherit;background:#f8fafd;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,129,.18);background:#fff}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;border-radius:50%;color:var(--muted);font-size:1.1rem;display:none}
.search .clear:hover{background:var(--brand-light)}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:70vh;overflow:auto;padding:6px;display:none}
.results.open{display:block}
.results .meta{padding:8px 12px;font-size:.82rem;color:var(--muted)}
.results ul{list-style:none;margin:0;padding:0}
.results li{margin:0}
.hit{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px}
.hit:hover,.hit:focus-visible{background:var(--brand-light)}
.hit b{display:block;font-weight:600}
.hit small{color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--brand-light);color:var(--brand-dark);padding:2px 8px;border-radius:999px;margin-right:6px}
.btn-top{flex:none;border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;height:44px;padding:0 16px;font-weight:600;white-space:nowrap}
.btn-top:hover{background:var(--brand);color:#fff}

/* --------------------------- Menu lateral --------------------------- */
.sidebar{position:fixed;top:var(--topbar-h);bottom:0;left:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px 32px;z-index:50;transition:transform .25s ease}
.sidebar .label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.sidebar ol,.sidebar ul{list-style:none;margin:0 0 12px;padding:0}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--ink);font-size:.95rem;line-height:1.3}
.nav-link:hover{background:var(--brand-light)}
.nav-link .num{flex:none;width:26px;height:26px;border-radius:8px;background:#eef2f8;color:var(--muted);font-size:.78rem;font-weight:700;display:grid;place-items:center}
.nav-link[aria-current="page"]{background:var(--brand);color:#fff;font-weight:600}
.nav-link[aria-current="page"] .num{background:rgba(255,255,255,.22);color:#fff}
.scrim{display:none}

/* --------------------------- Conteúdo --------------------------- */
main{margin-left:var(--sidebar-w);padding:calc(var(--topbar-h) + 32px) 36px 40px;max-width:calc(1120px + var(--sidebar-w))}
main:focus{outline:none}
.page{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page[hidden]{display:none}
.page-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.page-head .badge{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--c-l,var(--brand-light))}
.page-head h2{font-size:1.75rem;color:var(--brand-dark)}
.page-head p{color:var(--muted);margin:.35em 0 0;font-size:1.04rem;max-width:70ch}
.page-head h2:focus{outline:none}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px}
.card h3{font-size:1.02rem;margin-bottom:12px;color:var(--brand-dark);display:flex;align-items:center;gap:8px}
.block-title{font-size:1.15rem;margin:30px 0 12px;color:var(--brand-dark)}
.block-title small{font-weight:400;color:var(--muted);font-size:.9rem;margin-left:6px}

/* Lista "quando utilizar" */
.when{list-style:none;padding:0;margin:0}
.when li{position:relative;padding-left:26px;margin:.5em 0}
.when li::before{content:"➜";position:absolute;left:0;color:var(--brand);font-weight:700}

/* Checklist visual */
.check{list-style:none;padding:0;margin:0}
.check li{margin:.35em 0}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.check label:hover{background:var(--brand-light)}
.check input{appearance:none;flex:none;width:22px;height:22px;margin:2px 0 0;border:2px solid #7d8ba0;border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"✓";color:#fff;font-size:.9rem;font-weight:700;line-height:1}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check input:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.progress{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:#e5eaf2;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s ease}
.link-btn{border:0;background:none;color:var(--brand);text-decoration:underline;padding:4px;font-size:.88rem}

/* Fluxo interativo */
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0;align-items:stretch}
.flow li{position:relative;flex:1 1 150px;min-width:150px;margin:0;padding-right:34px;display:flex}
.flow li:last-child{padding-right:0}
.flow li:not(:last-child)::after{content:"";position:absolute;right:4px;top:50%;width:26px;height:2px;background:var(--brand);transform:translateY(-50%)}
.flow li:not(:last-child)::before{content:"";position:absolute;right:4px;top:50%;border:6px solid transparent;border-left:9px solid var(--brand);border-right:0;transform:translateY(-50%)}
.step{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease,background .15s}
.step:hover{transform:translateY(-2px);border-color:var(--brand)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand-light);color:var(--brand-dark);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.step .t{font-weight:600;line-height:1.25}
.step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step[aria-pressed="true"] .n{background:#fff;color:var(--brand)}
.flow-detail{margin-top:14px;background:var(--brand-light);border-left:5px solid var(--brand);border-radius:10px;padding:14px 18px}
.flow-detail b{color:var(--brand-dark)}

/* Tabela "Quem acionar" */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:420px}
caption{text-align:left;padding:12px 18px;font-weight:600;color:var(--muted);font-size:.88rem}
th,td{text-align:left;padding:12px 18px;border-top:1px solid var(--line);vertical-align:top}
th{background:#f1f5fb;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td:first-child{font-weight:600;width:48%}
td .resp{display:inline-block;background:var(--brand-light);color:var(--brand-dark);padding:2px 10px;border-radius:999px;font-weight:600;font-size:.92rem}

/* Accordion */
.acc-tools{display:flex;justify-content:flex-end;margin:-6px 0 8px}
.acc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;border:0;background:#fff;padding:16px 20px;font-weight:600;font-size:1.02rem}
.acc-btn:hover{background:#f7faff}
.acc-btn .chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:grid;place-items:center;transition:transform .25s ease;font-size:.8rem}
.acc-btn[aria-expanded="true"]{background:#f7faff}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(180deg);background:var(--brand);color:#fff}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc-panel.open{grid-template-rows:1fr}
.acc-panel > div{overflow:hidden}
.acc-body{padding:4px 22px 18px}
.acc-body h4{margin:16px 0 6px;font-size:.95rem;color:var(--brand-dark)}
.acc.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(255,183,3,.7)}100%{box-shadow:var(--shadow)}}

/* Avisos */
.note,.warn,.danger{border-radius:12px;padding:12px 16px;margin:12px 0;border-left:5px solid;display:flex;gap:10px;align-items:flex-start}
.note{background:var(--brand-light);border-color:var(--brand);color:var(--brand-dark)}
.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.note .ic,.warn .ic,.danger .ic{flex:none;font-size:1.1rem;line-height:1.5}
.alert-big{font-size:1.04rem;font-weight:600}
.next{background:linear-gradient(135deg,var(--brand),#256fb0);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-top:28px;box-shadow:var(--shadow)}
.next h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.next p{margin:0;font-size:1.05rem}

mark.hl{background:#ffe27a;color:#1b2430;border-radius:3px;padding:0 1px}

/* --------------------------- Página inicial --------------------------- */
.hero{background:linear-gradient(135deg,var(--brand-dark),var(--brand) 60%,#2f84c9);color:#fff;border-radius:22px;padding:34px 34px 30px;box-shadow:var(--shadow-lg);margin-bottom:26px}
.hero h2{font-size:1.9rem;margin-bottom:8px}
.hero p{max-width:62ch;opacity:.95;margin-bottom:18px}
.finder{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(255,255,255,.14);border-radius:14px;padding:12px}
.finder label{font-weight:600}
.finder select{flex:1 1 260px;height:44px;border-radius:10px;border:0;padding:0 12px;font:inherit;color:var(--ink);background:#fff}
.finder button{height:44px;border:0;border-radius:10px;padding:0 20px;background:#ffb703;color:#1b2430;font-weight:700}
.finder button:hover{background:#ffc833}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dcard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c,var(--brand));border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.dcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.dcard .ic{width:46px;height:46px;border-radius:13px;background:var(--c-l,var(--brand-light));display:grid;place-items:center;font-size:1.4rem}
.dcard b{font-size:1.05rem;color:var(--brand-dark)}
.dcard span.d{color:var(--muted);font-size:.92rem;line-height:1.45}
.dcard .go{margin-top:auto;font-weight:600;color:var(--brand);font-size:.9rem}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;counter-reset:q;list-style:none;padding:0;margin:0}
.five li{counter-increment:q;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:0}
.five li::before{content:counter(q);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;margin-bottom:8px}
.five b{display:block;color:var(--brand-dark)}
.five span{color:var(--muted);font-size:.92rem}

/* Apresentação: papel da coordenação */
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.vs .card.yes{border-top:5px solid var(--ok)}
.vs .card.no{border-top:5px solid var(--danger-line)}
.vs li{margin:.5em 0}

/* Reclassificação */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.field b{display:flex;align-items:center;gap:8px;color:var(--brand-dark);margin-bottom:4px}
.field .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand-light);font-size:.9rem}
.field span{color:var(--muted);font-size:.93rem;line-height:1.45}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.form input,.form textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,129,.18)}
.form .full{grid-column:1/-1}
.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:11px 18px;font-weight:600}
.btn:hover{background:var(--brand-dark)}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sec:hover{background:var(--brand-light)}
.out{width:100%;min-height:150px;font:.92rem/1.5 Consolas,monospace;border:1.5px dashed var(--line);border-radius:10px;padding:12px;background:#f8fafd;color:var(--ink);margin-top:12px}

/* Contatos */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.contato{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:5px solid var(--c,var(--brand))}
.contato h3{font-size:1.1rem;color:var(--brand-dark);margin-bottom:6px}
.contato .fn{display:inline-block;background:var(--brand-light);color:var(--brand-dark);font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.contato ul{font-size:.93rem;color:var(--muted)}
.contato dl{margin:10px 0 0;font-size:.92rem}
.contato dt{font-weight:700;display:inline}
.contato dd{display:inline;margin:0 0 0 4px}
.contato .row{margin:3px 0}

/* FAQ */
.faq-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:hover{border-color:var(--brand)}

code,kbd{font:.88em Consolas,monospace;background:#eef2f8;padding:1px 6px;border-radius:5px}
pre{background:#10233a;color:#e8f0fa;padding:14px 16px;border-radius:12px;overflow:auto;font:.85rem/1.5 Consolas,monospace}
footer{margin:40px 0 0;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}

/* --------------------------- Responsivo --------------------------- */
@media (max-width:1000px){
  .burger{display:grid;place-items:center}
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);width:min(320px,86vw)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:var(--topbar-h) 0 0 0;background:rgba(10,20,35,.45);z-index:40}
  main{margin-left:0;padding:calc(var(--topbar-h) + 22px) 16px 32px}
  .brand p{display:none}
}
@media (max-width:640px){
  .topbar{padding:0 12px;gap:8px}
  .brand-mark{display:none}
  .brand h1{font-size:.78rem;white-space:normal;line-height:1.15;overflow-wrap:anywhere}
  .brand{flex:0 1 104px}
  .search{min-width:0;flex:1 1 120px;margin-left:0}
  .search input{padding:0 34px 0 38px}
  .search .ico{left:12px}
  .btn-top span{display:none}
  .btn-top{padding:0 13px}
  .hero{padding:24px 20px}
  .hero h2{font-size:1.5rem}
  .page-head h2{font-size:1.4rem}
  /* fluxo vertical no celular */
  .flow{flex-direction:column}
  .flow li{padding:0 0 30px;flex:none;min-width:0}
  .flow li:last-child{padding-bottom:0}
  .flow li:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:4px;width:2px;height:20px;transform:translateX(-50%)}
  .flow li:not(:last-child)::before{right:auto;left:50%;top:auto;bottom:0;border:6px solid transparent;border-top:9px solid var(--brand);border-bottom:0;transform:translateX(-50%)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .topbar,.sidebar,.btn-top,.finder{display:none!important}
  main{margin:0;padding:0}
  .acc-panel{grid-template-rows:1fr!important}

/* ---- C2. Geradores de HTML ---- */
function blocos(list){
  return list.map(b => {
    if(typeof b === "string") return `<p>${b}</p>`;
    if(b.h)      return `<h4>${b.h}</h4>`;
    if(b.ul)     return `<ul>${b.ul.map(i=>`<li>${i}</li>`).join("")}</ul>`;
    if(b.note)   return `<div class="note"><span class="ic" aria-hidden="true">ℹ️</span><div>${b.note}</div></div>`;
    if(b.warn)   return `<div class="warn"><span class="ic" aria-hidden="true">⚠️</span><div>${b.warn}</div></div>`;
    if(b.danger) return `<div class="danger"><span class="ic" aria-hidden="true">🚫</span><div>${b.danger}</div></div>`;
    return "";
  }).join("");
}
let accSeq = 0;
function accordion(titulo, corpo, extraClass=""){
  const id = "acc" + (++accSeq);
  return `<div class="acc ${extraClass}" data-unit="acc">
    <h3 style="font-size:inherit"><button class="acc-btn" id="${id}-b" aria-expanded="false" aria-controls="${id}-p"><span>${titulo}</span><span class="chev" aria-hidden="true">▼</span></button></h3>
    <div class="acc-panel" id="${id}-p" role="region" aria-labelledby="${id}-b"><div><div class="acc-body">${corpo}</div></div></div>
  </div>`;
}
function accTools(){ return `<div class="acc-tools"><button class="link-btn" data-act="toggle-all">Expandir / recolher tudo</button></div>`; }
function head(sec, icon, titulo, resumo, extraStyle=""){
  const i = SECOES.findIndex(s => s.id === sec) + 1;
  return `<div class="page-head" style="${extraStyle}">
    <div class="badge" aria-hidden="true">${icon}</div>
    <div><div class="eyebrow">Seção ${i} de ${SECOES.length}</div><h2 tabindex="-1">${titulo}</h2><p>${resumo}</p></div>
  </div>`;
}

/* ---- C5. Navegação por seções (hash: #/nf) ---- */
let atual = "inicio";
function show(id, {focus=true}={}){
  if(!$(`.page[data-sec="${id}"]`)) id = "inicio";
  atual = id;
  $$(".page").forEach(s => s.hidden = s.dataset.sec !== id);
  $$(".nav-link").forEach(b => b.dataset.go === id ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  document.body.classList.remove("menu-open");
  $("#burger").setAttribute("aria-expanded","false");
  window.scrollTo({top:0, behavior:"auto"});
  const sec = $(`.page[data-sec="${id}"]`);
  document.title = (id==="inicio" ? "" : (SECOES.find(s=>s.id===id)||{}).menu + " · ") + "Guia de Processos Administrativos";
  if(focus){ const h = $("h2", sec); if(h) h.focus({preventScroll:true}); }
  applyHighlight();
}
function go(id, opts){
  if(location.hash === "#/" + id){ show(id, opts); } else { location.hash = "#/" + id; }
}
window.addEventListener("hashchange", () => show((location.hash.match(/^#\/(.+)$/)||[])[1] || "inicio"));

/* ---- C6. Accordions, fluxo, checklist, FAQ, reclassificação (delegação de eventos) ---- */
function setAcc(acc, open){
  const b = $(".acc-btn", acc), p = $(".acc-panel", acc);
  b.setAttribute("aria-expanded", open); p.classList.toggle("open", open);
}
function setupFlows(){
  PROCESSOS.forEach(p => {
    const box = $(`[data-flow="${p.id}"]`);
    const sel = i => {
      $$(".step", box).forEach((b,k)=>b.setAttribute("aria-pressed", k===i));
      $(".flow-detail", box).innerHTML = `<b>Etapa ${i+1} — ${p.fluxo[i].t}.</b> ${p.fluxo[i].d}`;
    };
    box.addEventListener("click", e => { const b = e.target.closest(".step"); if(b) sel(+b.dataset.i); });
    sel(0);
  });
}
function setupChecklists(){
  PROCESSOS.forEach(p => {
    const card = $(`[data-checklist="${p.id}"]`), boxes = $$("input", card);
    const upd = () => {
      const n = boxes.filter(b=>b.checked).length;
      $(".bar i", card).style.width = (n/boxes.length*100) + "%";
      $(".pcount", card).textContent = `${n} de ${boxes.length} reunidos`;
      store.set("dse-check-"+p.id, boxes.map(b=>b.checked));
    };
    const saved = store.get("dse-check-"+p.id);
    if(Array.isArray(saved)) boxes.forEach((b,i)=> b.checked = !!saved[i]);
    card.addEventListener("change", upd);
    card.addEventListener("click", e => { if(e.target.dataset.act==="reset-check"){ boxes.forEach(b=>b.checked=false); upd(); } });
    upd();
  });
}
function setupReclass(){
  const g = id => $("#"+id);
  if(!g("rc-gen")) return;
  const gerar = () => {
    const v = id => (g(id).value || "").trim() || "(não informado)";
    g("rc-out").value =
`SOLICITAÇÃO DE RECLASSIFICAÇÃO
Origem (classificação atual): ${v("rc-o")}
Destino (classificação pretendida): ${v("rc-d")}
Centro de custo/resultado: ${v("rc-cc")}
CR: ${v("rc-cr")}
Filial: ${v("rc-f")}
Justificativa: ${v("rc-j")}

Documentos de suporte anexados: (listar)
Áreas envolvidas: (listar)`;
  };
  g("rc-gen").addEventListener("click", gerar);
  g("rc-copy").addEventListener("click", () => {
    if(!g("rc-out").value) gerar();
    const out = g("rc-out"); out.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(out.value).then(()=>{ok=true;}).catch(()=>{}); }
    g("rc-msg").textContent = "Resumo copiado.";
  });
}

document.addEventListener("click", e => {
  const t = e.target;
  // sanfona
  const ab = t.closest(".acc-btn");
  if(ab){ setAcc(ab.closest(".acc"), ab.getAttribute("aria-expanded") !== "true"); return; }
  // expandir/recolher tudo
  if(t.dataset && t.dataset.act === "toggle-all"){
    const accs = $$(".acc", t.closest(".page")).filter(a => !a.hidden);
    const abrir = accs.some(a => $(".acc-btn", a).getAttribute("aria-expanded") !== "true");
    accs.forEach(a => setAcc(a, abrir));
    return;
  }
  // navegação
  const g = t.closest("[data-go]");
  if(g){ go(g.dataset.go); return; }
  // filtro FAQ
  const chip = t.closest(".chip");
  if(chip){
    $$(".chip").forEach(c => c.setAttribute("aria-pressed", c===chip));
    $$("#faq-list [data-unit='faq']").forEach(a => a.hidden = chip.dataset.cat !== "Todas" && a.dataset.cat !== chip.dataset.cat);
  }
});

/* ---- C7. Busca em tempo real com destaque ---- */
let unidades = [];
function indexar(){
  unidades = [];
  SECOES.forEach(s => {
    const p = PROCESSOS.find(x=>x.id===s.id);
    const extra = p ? (p.keys + " " + p.resumo + " " + p.card) : s.menu;
    unidades.push({sec:s.id, tipo:"Seção", titulo:s.menu, el:null, texto:s.menu + " " + extra, rank:0});
  });
  $$(".page").forEach(pg => {
    const sec = pg.dataset.sec; if(sec==="inicio") return;
    $$("[data-unit='acc'],[data-unit='faq']", pg).forEach(a => {
      unidades.push({sec, tipo: a.dataset.unit==="faq" ? "FAQ" : "Orientação", titulo:$(".acc-btn span", a).textContent, el:a, texto:a.textContent, rank:2});
    });
    $$("[data-unit='contato']", pg).forEach(a => unidades.push({sec, tipo:"Contato", titulo:$("h3",a).textContent, el:a, texto:a.textContent, rank:2}));
  });
  unidades.forEach(u => { u.nt = norm(u.texto); u.ntit = norm(u.titulo); });
}
let termo = "";
function buscar(q){
  const nq = norm(q.trim());
  if(nq.length < 2) return [];
  return unidades.filter(u => u.nt.includes(nq))
    .map(u => ({...u, score: (u.ntit.includes(nq) ? 0 : 1) + (u.tipo==="Seção" ? 0 : 1)}))
    .sort((a,b) => a.score - b.score);
}
function secNome(id){ return (SECOES.find(s=>s.id===id)||{}).menu || ""; }
function mostrarResultados(){
  const box = $("#results"), inp = $("#q");
  termo = inp.value;
  $("#qclear").style.display = termo ? "block" : "none";
  if(norm(termo.trim()).length < 2){ box.classList.remove("open"); inp.setAttribute("aria-expanded","false"); applyHighlight(); return; }
  const r = buscar(termo), max = 14;
  box.innerHTML = r.length
    ? `<div class="meta">${r.length} resultado${r.length>1?"s":""} para “${termo.replace(/</g,"&lt;")}”${r.length>max?` · mostrando ${max}`:""}</div><ul>${r.slice(0,max).map((u,i)=>`<li><button class="hit" data-hit="${i}"><b><span class="tag">${u.tipo}</span>${u.titulo}</b>${u.tipo==="Seção"?"":`<small>em ${secNome(u.sec)}</small>`}</button></li>`).join("")}</ul>`
    : `<div class="meta">Nenhum resultado para “${termo.replace(/</g,"&lt;")}”. Tente outra palavra (ex.: nota, contrato, rpa, boleto).</div>`;
  box._r = r;
  box.classList.add("open"); inp.setAttribute("aria-expanded","true");
  applyHighlight();
}
function abrirResultado(u){
  $("#results").classList.remove("open"); $("#q").setAttribute("aria-expanded","false");
  go(u.sec, {focus:false});
  setTimeout(() => {
    if(u.el){
      if(u.el.classList.contains("acc")){ u.el.hidden = false; setAcc(u.el, true); }
      u.el.scrollIntoView({block:"center", behavior:"smooth"});
      u.el.classList.remove("flash"); void u.el.offsetWidth; u.el.classList.add("flash");
      const b = $(".acc-btn", u.el); if(b) b.focus({preventScroll:true});
    } else { const h = $(`.page[data-sec="${u.sec}"] h2`); if(h) h.focus({preventScroll:true}); }
  }, 80);
}
function clearMarks(root){
  $$("mark.hl", root).forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
}
function marcar(root, q){
  const nq = norm(q.trim()); if(nq.length < 2) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n =>
    (!n.nodeValue.trim() || n.parentElement.closest("script,style,textarea,input,select,pre")) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nos = []; while(w.nextNode()) nos.push(w.currentNode);
  nos.forEach(n => {
    const t = n.nodeValue, nt = norm(t); if(nt.length !== t.length) return;
    let i = nt.indexOf(nq); if(i < 0) return;
    const frag = document.createDocumentFragment(); let last = 0;
    while(i >= 0){
      frag.append(t.slice(last,i));
      const m = document.createElement("mark"); m.className = "hl"; m.textContent = t.slice(i, i+nq.length); frag.append(m);
      last = i + nq.length; i = nt.indexOf(nq, last);
    }
    frag.append(t.slice(last)); n.parentNode.replaceChild(frag, n);
  });
}
function applyHighlight(){
  const main = $("#conteudo");
  clearMarks(main);
  if(norm((termo||"").trim()).length >= 2){ const pg = $(`.page[data-sec="${atual}"]`); if(pg) marcar(pg, termo); }
}
function setupBusca(){
  const inp = $("#q"), box = $("#results");
  let t; inp.addEventListener("input", () => { clearTimeout(t); t = setTimeout(mostrarResultados, 80); });
  inp.addEventListener("keydown", e => {
    const hits = $$(".hit", box);
    if(e.key === "ArrowDown" && hits.length){ e.preventDefault(); hits[0].focus(); }
    if(e.key === "Enter" && box._r && box._r.length){ e.preventDefault(); abrirResultado(box._r[0]); }
    if(e.key === "Escape"){ box.classList.remove("open"); inp.setAttribute("aria-expanded","false"); }
  });
  box.addEventListener("keydown", e => {
    const hits = $$(".hit", box), i = hits.indexOf(document.activeElement);
    if(e.key === "ArrowDown"){ e.preventDefault(); (hits[i+1]||hits[i]).focus(); }
    if(e.key === "ArrowUp"){ e.preventDefault(); (i>0 ? hits[i-1] : inp).focus(); }
    if(e.key === "Escape"){ box.classList.remove("open"); inp.focus(); }
  });
  box.addEventListener("click", e => { const b = e.target.closest(".hit"); if(b) abrirResultado(box._r[+b.dataset.hit]); });
  $("#qclear").addEventListener("click", () => { inp.value = ""; mostrarResultados(); inp.focus(); });
  document.addEventListener("click", e => { if(!e.target.closest(".search")){ box.classList.remove("open"); inp.setAttribute("aria-expanded","false"); } });
  // atalho: "/" foca a pesquisa
  document.addEventListener("keydown", e => {
    if(e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); inp.focus(); }
  });
}

/* ---- C8. Inicialização ---- */
render();
setupFlows();
setupChecklists();
setupReclass();
indexar();
setupBusca();
show((location.hash.match(/^#\/(.+)$/)||[])[1] || "inicio", {focus:false});
</script>
